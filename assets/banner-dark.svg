      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(0.72); }
      }
      .bar { animation-name: breathe; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
