<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Praveen Nukilla — Applied AI &amp; Backend Engineer">
  <defs>
    <style>
      .eyebrow { font: 600 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: .18em; fill: #d11440; }
      .name    { font: 700 46px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e6edf3; }
      .role    { font: 400 20px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #8b949e; }
      .caption { font: 400 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: .02em; }
      .label   { font: 600 11px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: .2em; fill: #8b949e; }

      .reveal { opacity: 0; transform: translateY(10px); animation: revealText .6s cubic-bezier(.16,1,.3,1) forwards; }

      @keyframes revealText {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes riseIn {
        0%   { transform: scaleY(0); opacity: 0; }
        55%  { transform: scaleY(1.12); opacity: 1; }
        100% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(0.82); }
      }
      .bar { transform: scaleY(0); opacity: 0; }

      .panel-border {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 0.55s ease-out 0.05s forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .rec-dot {
        transform-box: fill-box; transform-origin: center;
        transform: scale(0); opacity: 0;
        animation: recPop .3s cubic-bezier(.34,1.56,.64,1) 0.65s forwards,
                   pulse 1.7s ease-in-out 0.95s infinite;
      }
      @keyframes recPop { to { transform: scale(1); opacity: 1; } }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar, .reveal, .panel-border, .rec-dot { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

