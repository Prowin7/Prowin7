    <g transform="translate(529.0 39.0) scale(1.333)" opacity="0.85">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatA 4.2s ease-in-out 0.0s infinite;">
        <g fill="none" stroke="#61DAFB" stroke-width="1.4">
      <ellipse cx="12" cy="12" rx="10" ry="4"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>
    </g><circle cx="12" cy="12" r="2" fill="#61DAFB"/>
      </g>
    </g>
    <g transform="translate(642.0 87.0) scale(1.083)" opacity="0.8">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatB 4.8s ease-in-out 0.5s infinite;">
        <path d="M12 2l7 4v3l-7-4-7 4V6z" fill="#FF6F00"/>
    <path d="M12 9l7 4v3l-7-4-7 4v-3z" fill="#FF6F00" opacity="0.8"/>
    <path d="M12 16l5 3-5 3-5-3z" fill="#FF6F00" opacity="0.6"/>
      </g>
    </g>
    <g transform="translate(558.0 168.0) scale(1.000)" opacity="0.85">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatC 3.7s ease-in-out 1.2s infinite;">
        <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z" fill="#8ab4f8"/>
    <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z" fill="#c58af9"/>
      </g>
    </g>
    <g transform="translate(690.0 35.0) scale(1.250)" opacity="0.85">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatC 3.9s ease-in-out 1.0s infinite;">
        <rect x="5" y="8" width="3" height="3" fill="#2496ED"/>
    <rect x="9" y="8" width="3" height="3" fill="#2496ED"/>
    <rect x="13" y="8" width="3" height="3" fill="#2496ED"/>
    <rect x="9" y="4" width="3" height="3" fill="#2496ED"/>
    <path d="M2 14c1-2 3-3 5-3h10c2 0 3 1 4 3-1 3-4 5-9 5S3 17 2 14z" fill="#2496ED"/>
