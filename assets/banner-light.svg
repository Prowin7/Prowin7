<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Praveen Nukilla &#8212; Applied AI &amp; Backend Engineer">
  <defs>
    <style>
      .eyebrow { font: 600 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: .18em; fill: #a8865c; }
      .name    { font: 700 46px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #0d1117; }
      .role    { font: 400 20px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #57606a; }
      .caption { font: 400 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #57606a; letter-spacing: .02em; }

      /* Every animated element below rests at its FINAL state and animates in
         from a keyframed start with fill-mode backwards, so a renderer that
         skips animations still shows the composed banner. */

      .reveal { animation: revealText .6s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes revealText { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .name-in {
        transform-box: fill-box; transform-origin: left bottom;
        animation: nameIn .72s cubic-bezier(.22,1.42,.36,1) .16s backwards;
      }
      @keyframes nameIn {
        0%   { opacity: 0; transform: translateY(14px) scale(.94, 1.06); }
        60%  { opacity: 1; transform: translateY(0)    scale(1.02, .98); }
        100% { opacity: 1; transform: translateY(0)    scale(1, 1); }
      }

      /* ---------- floating icon field ---------- */
      @keyframes floatA {
        0%   { transform: translateY(0) rotate(0deg); }
        50%  { transform: translateY(-9px) rotate(-3deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes floatB {
        0%   { transform: translateY(0) rotate(0deg); }
        50%  { transform: translateY(7px) rotate(2.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes floatC {
        0%   { transform: translateY(0) rotate(0deg); }
        50%  { transform: translateY(-6px) rotate(3deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      /* ---------- swinging astronaut ---------- */
      @keyframes pendulumSwing {
        0%   { transform: rotate(-7deg); }
        50%  { transform: rotate(7deg); }
        100% { transform: rotate(-7deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal, .name-in {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .icons g g { animation: none !important; transform: none !important; }
        .astronaut g { animation: none !important; transform: none !important; }
      }
</style>
  </defs>

