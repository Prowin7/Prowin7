        <path d="M15 8a5 5 0 00-9.6 1.8A4 4 0 006 18h9a4.5 4.5 0 000-9 5 5 0 000-1z" fill="#4285F4"/>
      </g>
    </g>
    <g transform="translate(609.0 239.0) scale(1.333)" opacity="0.9">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatA 4.6s ease-in-out 0.3s infinite;">
        <path d="M8 3h6a3 3 0 013 3v3H9a3 3 0 00-3 3v2H4a3 3 0 01-3-3V8a5 5 0 015-5z" fill="#3776AB"/>
    <circle cx="7" cy="6" r="1" fill="#fff"/>
    <path d="M16 21h-6a3 3 0 01-3-3v-3h8a3 3 0 003-3V10h2a3 3 0 013 3v3a5 5 0 01-5 5z" fill="#FFD43B"/>
    <circle cx="17" cy="18" r="1" fill="#0d1117"/>
      </g>
    </g>
    <g transform="translate(752.0 192.0) scale(1.083)" opacity="0.8">
      <g style="transform-box:fill-box;transform-origin:center;animation:floatC 5.0s ease-in-out 0.7s infinite;">
        <circle cx="12" cy="7" r="3" fill="none" stroke="#F37626" stroke-width="1.3"/>
    <circle cx="7" cy="16" r="3" fill="none" stroke="#F37626" stroke-width="1.3"/>
    <circle cx="17" cy="16" r="3" fill="none" stroke="#F37626" stroke-width="1.3"/>
