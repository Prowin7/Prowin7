  <g class="astronaut" aria-hidden="true" transform="translate(1120 12)">
    <g style="transform-box:fill-box;transform-origin:50% 0%;animation:pendulumSwing 4.8s ease-in-out infinite;">
      <line x1="-7" y1="0" x2="-9" y2="64" stroke="#57606a" stroke-width="1.2" opacity="0.65"/>
      <line x1="6"  y1="0" x2="27" y2="33"  stroke="#57606a" stroke-width="1.2" opacity="0.65"/>

      <!-- backpack, drawn first so it peeks out from behind the torso -->
      <rect x="-21" y="66" width="15" height="40" rx="6" fill="#dcdfe3" stroke="#12151a" stroke-width="1.8"/>

      <!-- far (left) arm: relaxed, bent at the elbow, resting near the hip -->
      <path d="M-16 70 Q-29 84 -17 98" stroke="#12151a" stroke-width="9.5" fill="none" stroke-linecap="round"/><path d="M-16 70 Q-29 84 -17 98" stroke="#eef0f3" stroke-width="6.5" fill="none" stroke-linecap="round"/>
      <circle cx="-17" cy="98" r="5" fill="#dcdfe3" stroke="#12151a" stroke-width="1.6"/>

      <!-- legs: knees drawn up and out, reclined seated pose -->
      <path d="M-8 108 Q-25 120 -19 138 Q-15 152 -2 148" stroke="#12151a" stroke-width="9.5" fill="none" stroke-linecap="round"/><path d="M-8 108 Q-25 120 -19 138 Q-15 152 -2 148" stroke="#eef0f3" stroke-width="6.5" fill="none" stroke-linecap="round"/>
      <path d="M8 108 Q23 122 17 140 Q13 154 26 152" stroke="#12151a" stroke-width="9.5" fill="none" stroke-linecap="round"/><path d="M8 108 Q23 122 17 140 Q13 154 26 152" stroke="#eef0f3" stroke-width="6.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-2" cy="148" rx="7" ry="4.5" fill="#dcdfe3" stroke="#12151a" stroke-width="1.6"/>
      <ellipse cx="26" cy="152" rx="7" ry="4.5" fill="#dcdfe3" stroke="#12151a" stroke-width="1.6"/>

      <!-- torso -->
      <rect x="-17" y="64" width="34" height="46" rx="16" fill="#f5f6f8" stroke="#12151a" stroke-width="2.2"/>

      <!-- chest control panel -->
      <rect x="-8" y="81" width="17" height="13" rx="2.5" fill="#dcdfe3" stroke="#12151a" stroke-width="1.3"/>
      <circle cx="-3" cy="87" r="1.6" fill="#a8865c"/>
      <line x1="2" y1="85" x2="6" y2="85" stroke="#12151a" stroke-width="1"/>
      <line x1="2" y1="89" x2="6" y2="89" stroke="#12151a" stroke-width="1"/>

      <!-- shoulder joints -->
