      <circle cx="27" cy="33" r="5.2" fill="#dcdfe3" stroke="#12151a" stroke-width="1.6"/>

      <!-- neck ring -->
      <ellipse cx="0" cy="62" rx="12" ry="5" fill="#dcdfe3" stroke="#12151a" stroke-width="1.6"/>

      <!-- helmet -->
      <circle cx="0" cy="42" r="21" fill="#f5f6f8" stroke="#12151a" stroke-width="2.4"/>
      <ellipse cx="3" cy="43" rx="14" ry="16" fill="#0a0b0d"/>
      <path d="M-7 33 Q-1 24 8 29" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.35"/>
      <circle cx="-17" cy="49" r="1.7" fill="#a8865c"/>
